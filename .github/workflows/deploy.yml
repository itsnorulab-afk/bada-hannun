name: Deploy Bada Hannun to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch KHOA high-low tide forecasts
        id: khoa
        continue-on-error: true
        env:
          KHOA_API_KEY: ${{ secrets.KHOA_API_KEY }}
        run: python3 scripts/fetch_khoa_tides.py
      - name: Publish safe KHOA status
        if: always()
        env:
          KHOA_OUTCOME: ${{ steps.khoa.outcome }}
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, os, pathlib, datetime
          p=pathlib.Path('data/tides.json')
          valid=False; count=0
          if p.is_file():
              try:
                  j=json.loads(p.read_text())
                  count=len(j.get('stations',[]))
                  valid=count>0
              except Exception: pass
          status={'state':'available' if valid else 'collection_failed',
                  'stations':count,
                  'actionOutcome':os.environ.get('KHOA_OUTCOME','unknown'),
                  'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('data/tides-status.json').write_text(json.dumps(status),encoding='utf-8')
          print('Tide publishing state:',status['state'],'stations:',count)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
